name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Run CI Validation Check (lint, typecheck, tests, build)
        run: npm run check
        env:
          # Build must succeed without a real DSN: e.g. first-time
          # contributors do not have access to the production database.
          AUTH_SECRET: ci-only-secret